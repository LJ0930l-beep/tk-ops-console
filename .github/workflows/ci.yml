name: CI

# 这条流水线的四个步骤与本地四道门禁一一对应，缺一条都不算绿：
#   lint → test（服务端 + web）→ build → smoke（真实 HTTP 全路由 × 角色 × 写链路）
# e2e 单独一个 job 与 gates 并行：它是唯一会真的开浏览器看渲染的一层，
# 也是唯一能抓到「按需引入后图标丢了」「setup 里暂时性死区整页白屏」这类缺陷的一层
# —— 这两件事都在本地跑 e2e 时当场翻出来的，前三个 job 全绿也照样存在。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 静态检查 · 单测 · 构建 · 冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # node:sqlite 是本项目唯一的数据驱动，22.5 之前没有这个模块（见 package.json engines）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖（锁文件必须与 package.json 同步）
        run: npm ci

      # 注意：@tk/shared 的 main/types 指向它自己的 dist（gitignore 的产物）。
      # 干净环境里必须先构建它，否则 tsc 报 108 个 Cannot find module '@tk/shared'、
      # 后端 tsx 起不来连带 webServer 超时。root package.json 的 prelint/pretest/... 已经兜住，
      # 所以这里不要"优化"成直接调 npx vitest / npx tsc。
      - name: 类型检查（服务端 tsc + web vue-tsc）
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npm run build

      - name: 全链路冒烟（路由清单 × 逐角色 GET × 写链路）
        run: npm run smoke

      # 契约与前端路径类型都是生成物：落后于代码就是「文档在骗人」，直接判红
      - name: 生成物不得落后于代码
        run: |
          npm run openapi
          git diff --exit-code -- docs/openapi.json apps/web/src/api/paths.ts || {
            echo "::error::docs/openapi.json 或 apps/web/src/api/paths.ts 过期了：本地跑 npm run openapi 后连同代码一起提交"
            exit 1
          }
          git diff --exit-code -- apps/web/src/components.d.ts apps/web/src/auto-imports.d.ts || {
            echo "::error::unplugin 的自动导入声明过期了：跑一次 npm run build -w @tk/web 后一起提交"
            exit 1
          }

      - name: 演示库不许被测试写脏（项目红线：apps/data/tk_ops.db 是仓库里的固定夹具）
        run: git diff --exit-code -- apps/data/tk_ops.db

  e2e:
    name: 端到端（Playwright / Chromium）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # --with-deps 顺带装 ubuntu 上缺的字体与系统库；只装 chromium，本项目没用 firefox/webkit
      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 自己起 dev:server + dev:web，
      # 并把库指到 node_modules/.cache/tk-e2e 下的临时文件（绝不碰仓库里那份演示库）
      # 用 npm run e2e 而不是 npx playwright test：前者的 pree2e 会先构建 @tk/shared，
      # 否则后端 tsx 起不来 → webServer 120s 超时
      - name: 端到端测试
        run: npm run e2e

      - name: 失败时留痕（trace / 截图 / 录像 / HTML 报告）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
